name: CI

# A push to a branch with an open pull request used to run every job twice, once for each event (R-40).
# Pushes now build master only; any other branch is built through its pull request, or by hand.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One run per pull request (or branch) at a time: a new push to a pull request cancels the run it
# supersedes. Runs on master are never cancelled, so every commit there keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: every job below that needs more says so itself. Without this block a
# workflow inherits whatever the repository default is, which for an older repository is often
# read-write on everything — so a compromised action, or a compromised dependency of one, would hold a
# token that can push to the default branch.
permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag. A tag is a mutable pointer: whoever controls the action
# repository can move `v4` to any commit at any time, and every workflow that referenced it runs the
# new code on the next build with no review and no signal. The trailing comment records which release
# each SHA was, so the pin can be read and bumped deliberately.
#
# Runners are pinned too: `ubuntu-latest` moves to a new Ubuntu on GitHub's schedule, not this
# repository's (R-40). Move `ubuntu-24.04` on purpose.

jobs:
  build-and-integration-test:
    name: Build + integration test (JDK 21)
    runs-on: ubuntu-24.04   # GitHub-hosted runners include Docker, which the integration test needs
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `mvn verify` packages the shaded provider JAR, then the Failsafe plugin runs LwsAuthIT, which
      # deploys that JAR into a real Keycloak container (the POM's keycloak.version) and exercises every suite. LwsAuthIT
      # binds host port 8080 — see its class javadoc — which is free on a hosted runner.
      # requireDocker turns "no Docker, every IT skipped" from a green build into a red one (R-43).
      - name: Build and run integration tests
        run: ./mvnw -B -ntp verify -Dlws.authn.requireDocker=true

      # Belt to requireDocker's braces: a green build must have run the integration tests, all of them.
      - name: Assert the integration tests ran
        run: |
          set -euo pipefail
          summary=target/failsafe-reports/failsafe-summary.xml
          completed=$(sed -n 's:.*<completed>\([0-9]*\)</completed>.*:\1:p' "$summary")
          skipped=$(sed -n 's:.*<skipped>\([0-9]*\)</skipped>.*:\1:p' "$summary")
          echo "integration tests completed: $completed, skipped: $skipped"
          if [ "${completed:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::LwsAuthIT did not run in full ($completed completed, $skipped skipped)."
            exit 1
          fi

      # The reports, pass or fail, so what ran — and what did not — can be seen from outside (R-43).
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lws-authn-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn

      - name: Upload provider JAR
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lws-authn-jar
          path: target/lws-authn-*.jar

      # The CycloneDX SBOM the build already produces (cyclonedx-maven-plugin, bound to `package`), kept
      # per build so what actually shipped can be matched against an advisory later without having to
      # rebuild this commit.
      - name: Upload SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lws-authn-sbom
          path: target/bom.*

  # Development happens on JDK 25 while the artifact targets 21, so the toolchain that most builds use
  # is not the one most edits are made under. This job closes that gap: it builds on 25 and then reads
  # the class-file version back out of the JAR, because `maven.compiler.release` silently doing nothing
  # is exactly the kind of regression that only shows up as a LinkageError inside Keycloak.
  build-on-jdk-25:
    name: Build on JDK 25, targeting 21
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests only: the integration test is covered by the JDK 21 job, and running two Keycloak
      # containers per push buys nothing.
      - name: Build
        run: ./mvnw -B -ntp package -DskipITs

      - name: Assert the class files are still Java 21
        run: |
          set -euo pipefail
          version=$(javap -verbose -cp target/classes com.ebremer.lws.authn.openid.LWSConstants \
                    | awk '/major version:/ { print $3 }')
          echo "class-file major version: $version"
          if [ "$version" != "65" ]; then
            echo "::error::Expected class-file major version 65 (Java 21), got $version." \
                 "maven.compiler.release is not being honoured, and the JAR will not load in a" \
                 "Keycloak running on 21."
            exit 1
          fi

  # Static analysis for the vulnerability classes a test suite does not look for. Java only; the build
  # is explicit rather than autobuild so it does not re-run the tests.
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # to upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Build for analysis
        run: ./mvnw -B -ntp compile -DskipTests

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # Blocks a pull request that introduces a dependency with a known advisory. Pull requests only —
  # it diffs the dependency graph against the base branch, so there is nothing for it to do on a push.
  # Continuous alerts for dependencies already on the default branch come from Dependabot instead
  # (.github/dependabot.yml).
  #
  # It needs the repository's dependency graph (Settings → Advanced Security → Dependency graph). With
  # the graph off, the action fails every pull request — "Dependency review is not supported on this
  # repository" — which is how every Dependabot update came to sit red (R-40). So the job asks first,
  # and while the graph is off it says so with a warning instead of failing; once the graph is on, the
  # review runs and blocks as intended, with no change here.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                     "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/sbom" || true)
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency review skipped: the dependency graph is not enabled for this" \
                 "repository (HTTP $status). Enable it under Settings → Advanced Security."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.graph.outputs.enabled == 'true'

      - name: Review dependency changes
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The dependency graph GitHub builds from pom.xml alone is the declared dependencies, not what Maven
  # resolves: Jena's transitive libraries — most of what the shaded JAR contains — are not in it, so
  # neither Dependabot alerts nor the review above could see an advisory against them (R-40). This
  # submits the resolved graph for every commit on master. Like the review, it needs the dependency
  # graph enabled; until it is, the submission is refused and the job says so without failing the run.
  dependency-submission:
    name: Submit the resolved dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # the dependency submission API writes to the repository's dependency graph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Submit the Maven dependency graph
        continue-on-error: true
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
