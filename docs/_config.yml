# The lws-authn documentation site — the one copy of the documentation. The README at the repository
# root is a summary that links here.
#
# GitHub Pages builds this folder itself — Settings → Pages → Deploy from a branch → `master`, `/docs` —
# with the `github-pages` gem, so there is no workflow to maintain. `Gemfile` exists only to preview the
# site locally; see CONTRIBUTING.md.
#
# The site is this folder and nothing else: the build cannot see README.md, TODO.md, the source or
# scripts/. A link from a page here to anything outside docs/ must therefore be an absolute
# https://github.com/ebremer/lws-authn/... URL — a relative `../TODO.md` works when browsing the
# repository and is a 404 on the site.

title: lws-authn
description: >-
  Keycloak providers for the W3C Linked Web Storage (LWS) 1.0 authentication suites: OpenID Connect,
  self-signed controlled identifiers, and SAML 2.0.
lang: en

# `url` and `baseurl` are deliberately unset. On GitHub Pages, jekyll-github-metadata derives them from
# the repository (https://ebremer.github.io and /lws-authn), and keeps them right if a custom domain is
# ever added; a local preview serves from the root.

# Just the Docs, fetched by jekyll-remote-theme when the site is built. Pinned by commit, not by tag, for
# the reason .github/workflows/ci.yml pins its actions: a tag is a mutable pointer, and this theme's
# templates and JavaScript are served to every reader of the site. Dependabot does not see this pin, so
# bump it by hand from https://github.com/just-the-docs/just-the-docs/releases.
remote_theme: just-the-docs/just-the-docs@2ed4c0af735e95af5c0dcf7a605b07d903005b4e # v0.12.0

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache   # the theme's {% include_cached %}; the build fails without it
  - jekyll-seo-tag         # the theme's {% seo %}; likewise
  - jekyll-sitemap
  - jekyll-redirect-from   # a page's redirect_from keeps its old URL working after a rename

# Every page gets the theme's layout without having to name it.
#
# SECURITY.md and CONTRIBUTING.md are the two pages without front matter: GitHub also shows them on its
# own pages — the Security tab, the link offered to anyone opening an issue — which would render front
# matter as a table at the top. Their titles and places in the navigation are here instead, and
# jekyll-optional-front-matter makes them pages.
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: SECURITY.md }
    values: { title: Security policy, nav_order: 7 }
  - scope: { path: CONTRIBUTING.md }
    values: { title: Contributing, nav_order: 8 }

# jekyll-optional-front-matter skips a file named CONTRIBUTING unless it is listed here, and without
# remove_originals it would also publish each such file's Markdown source beside its page.
include:
  - CONTRIBUTING.md
optional_front_matter:
  remove_originals: true

# Header: the repository, for the source.
aux_links:
  "lws-authn on GitHub":
    - "https://github.com/ebremer/lws-authn"

search_enabled: true
heading_anchors: true
enable_copy_code_button: true

back_to_top: true
back_to_top_text: Back to top

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/ebremer/lws-authn
gh_edit_branch: master
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: >-
  Copyright Erich Bremer. lws-authn is licensed under the
  <a href="https://github.com/ebremer/lws-authn/blob/master/LICENSE">Apache License 2.0</a>.
